name: 功能建议
description: 提议符合 Quietype 阅读定位的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 说明现在遇到的问题，而不只是希望增加的控件。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明对阅读、性能、维护和兼容性的影响。
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: 是否引入新的外部请求或依赖
      options:
        - 否
        - 是，已在下方说明
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充信息
