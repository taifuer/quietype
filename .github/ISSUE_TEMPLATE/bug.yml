name: 问题报告
description: 报告可复现的主题错误或兼容性问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先确认问题在最新版本中仍可复现，安全问题请改用私有安全报告。
  - type: input
    id: version
    attributes:
      label: Quietype 版本
      placeholder: 例如 0.10.20
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: WordPress、PHP、浏览器及设备版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写明最小复现内容、操作顺序和实际结果。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附截图、控制台输出或经过脱敏的日志。不要提交密码、入口参数或私人数据。
