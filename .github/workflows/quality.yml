name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quietype-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

  phpcs:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint -- --warning-severity=0

  browser:
    name: Browser, accessibility, visual, and performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check committed whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git show --check --oneline --no-renames HEAD
          fi
      - run: npm audit --audit-level=high
      - run: npm run test:js
      - run: npx playwright install --with-deps chromium
      - name: Start isolated WordPress
        run: npm run env:start
      - name: Seed deterministic content
        run: npm run env:seed
      - name: Run browser regression suite
        run: npm run test:e2e
      - name: Enforce Lighthouse budgets
        run: npm run test:performance
      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quietype-regression-artifacts
          path: |
            artifacts/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop WordPress
        if: always()
        run: npm run env:stop

  wordpress:
    name: WordPress ${{ matrix.version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '6.6'
            image: wordpress:6.6.2-php8.2-fpm
          - version: '6.8'
            image: wordpress:6.8.2-php8.2-fpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Start compatible WordPress
        env:
          QUIETYPE_WORDPRESS_IMAGE: ${{ matrix.image }}
        run: npm run env:start
      - name: Seed and smoke-test public routes
        env:
          QUIETYPE_WORDPRESS_IMAGE: ${{ matrix.image }}
        run: |
          npm run env:seed
          npm run env:check
          for path in / /quietype-reading-test/ /archive/ /books/ /photos/; do
            curl --fail --silent --show-error "http://localhost:8888${path}" >/dev/null
          done
      - name: Stop compatible WordPress
        if: always()
        env:
          QUIETYPE_WORDPRESS_IMAGE: ${{ matrix.image }}
        run: npm run env:stop
