name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quietype-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

  browser:
    name: Browser, accessibility, visual, and performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check committed whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git show --check --oneline --no-renames HEAD
          fi
      - run: npm audit --audit-level=high
      - run: npm run test:js
      - run: npx playwright install --with-deps chromium
      - name: Start isolated WordPress
        run: npm run env:start
      - name: Seed deterministic content
        run: npm run env:seed
      - name: Run browser regression suite
        run: npm run test:e2e
      - name: Enforce Lighthouse budgets
        run: npm run test:performance
      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quietype-regression-artifacts
          path: |
            artifacts/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop WordPress
        if: always()
        run: npm run env:stop
